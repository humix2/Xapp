<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>画像</title>
<link rel="stylesheet" href="image-viewer.css" />
</head>
<body>
  <div id="backdrop">
    <button id="close-btn" title="閉じる (Esc)">✕</button>
    <button id="prev-btn" title="前の画像 (←)">‹</button>
    <img id="viewer-img" alt="" />
    <button id="next-btn" title="次の画像 (→)">›</button>
    <div id="counter"></div>
  </div>
  <script src="image-viewer.js"></script>
</body>
</html>
