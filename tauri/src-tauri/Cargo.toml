[package]
name = "xdeck-tauri"
version = "0.1.0"
description = "XDeck prototype on Tauri (Rust + WebView2)"
edition = "2021"
publish = false

[lib]
name = "xdeck_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables several webviews in one window (one per column).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Must match the version wry uses, so the WebView2 COM types line up.
webview2-com = "0.39"
windows = "0.62"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
