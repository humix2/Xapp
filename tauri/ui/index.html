<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>XDeck</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toolbar">
    <form id="add-column-form">
      <select id="type-select">
        <option value="search">検索</option>
        <option value="home">ホーム（フォロー中）</option>
        <option value="notifications">通知</option>
        <option value="explore">話題を検索</option>
        <option value="trends">トレンド</option>
      </select>
      <input id="query-input" type="text" placeholder="検索キーワードを入力してカラム追加..." autocomplete="off" />
      <select id="sort-select">
        <option value="live">最新</option>
        <option value="top">話題</option>
      </select>
      <div id="search-operators"></div>
      <button type="submit">＋ カラム追加</button>
    </form>
    <div id="toolbar-actions">
      <button id="update-all-btn" type="button" title="全カラムを差分更新（新着のみ反映・スクロール位置を維持）">⟲ 全カラム更新</button>
      <button id="compose-btn" type="button">✎ ポストする</button>
    </div>
    <div id="window-controls">
      <button id="win-min" type="button" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg>
      </button>
      <button id="win-max" type="button" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 10 10"><path class="icon-max" d="M0.5 0.5h9v9h-9z" /><path class="icon-restore" d="M2.5 0.5h7v7M0.5 2.5h7v7h-7z" /></svg>
      </button>
      <button id="win-close" type="button" title="閉じる" aria-label="閉じる">
        <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg>
      </button>
    </div>
  </div>
  <div id="columns"></div>
  <script type="module" src="js/window-controls.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
